apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: C:\7MO CICLO\DSW\Club-Nautico\club-nautico-microservicios\kompose.exe convert -f docker-compose.yml -o k8s/
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: ms-socios
  name: ms-socios
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: ms-socios
  template:
    metadata:
      annotations:
        kompose.cmd: C:\7MO CICLO\DSW\Club-Nautico\club-nautico-microservicios\kompose.exe convert -f docker-compose.yml -o k8s/
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: ms-socios
    spec:
      containers:
        - env:
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://eureka-server:8761/eureka/
            - name: SERVER_PORT
              value: "8082"
            - name: SPRING_CONFIG_IMPORT
              value: optional:configserver:http://config-server:8888
            - name: SPRING_DATASOURCE_PASSWORD
              value: postgres
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres-socios:5434/sociosDb
            - name: SPRING_DATASOURCE_USERNAME
              value: postgres
          image: club-nautico-microservicios-ms-socios:latest
          imagePullPolicy: Never
          name: club-nautico-ms-socios
          ports:
            - containerPort: 8082
              protocol: TCP
      restartPolicy: Always
