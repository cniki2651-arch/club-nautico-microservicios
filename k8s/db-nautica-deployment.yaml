apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: C:\7MO CICLO\DSW\Club-Nautico\club-nautico-microservicios\kompose.exe convert -f docker-compose.yml -o k8s/
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: db-nautica
  name: db-nautica
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: db-nautica
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: C:\7MO CICLO\DSW\Club-Nautico\club-nautico-microservicios\kompose.exe convert -f docker-compose.yml -o k8s/
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: db-nautica
    spec:
      containers:
        - env:
            - name: MYSQL_DATABASE
              value: club_nautica_db
            - name: MYSQL_ROOT_PASSWORD
              value: root
          image: mysql:8.0
          livenessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
                - -uroot
                - -proot
            failureThreshold: 5
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          name: club-nautico-nautica-db
          ports:
            - containerPort: 3306
              protocol: TCP
          volumeMounts:
            - mountPath: /var/lib/mysql
              name: mysql-nautica-data
            - mountPath: /docker-entrypoint-initdb.d
              name: db-nautica-init-sql
      restartPolicy: Always
      volumes:
        - name: mysql-nautica-data
          persistentVolumeClaim:
            claimName: mysql-nautica-data
        - name: db-nautica-init-sql
          configMap:
            name: db-nautica-init-sql
