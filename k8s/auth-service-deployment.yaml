apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: C:\7MO CICLO\DSW\Club-Nautico\club-nautico-microservicios\kompose.exe convert -f docker-compose.yml -o k8s/
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: auth-service
  name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: auth-service
  template:
    metadata:
      annotations:
        kompose.cmd: C:\7MO CICLO\DSW\Club-Nautico\club-nautico-microservicios\kompose.exe convert -f docker-compose.yml -o k8s/
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: auth-service
    spec:
      containers:
        - env:
            - name: DB_PASSWORD
              value: root
            - name: DB_URL
              value: jdbc:postgresql://postgres-auth:5432/club_nautica_auth_db
            - name: DB_USERNAME
              value: postgres
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://eureka-server:8761/eureka/
            - name: JPA_SHOW_SQL
              value: "false"
            - name: JWT_ACCESS_EXPIRATION_MS
              value: "3600000"
            - name: JWT_REFRESH_EXPIRATION_DAYS
              value: "7"
            - name: JWT_SECRET
              value: EstaEsUnaClaveMuySecretaDeAlMenos32Caracteres!!!
            - name: SERVER_PORT
              value: "8081"
            - name: SPRING_CONFIG_IMPORT
              value: optional:configserver:http://config-server:8888
          image: auth-service
          name: club-nautico-auth-service
          ports:
            - containerPort: 8081
              protocol: TCP
      restartPolicy: Always
