apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: C:\7MO CICLO\DSW\Club-Nautico\club-nautico-microservicios\kompose.exe convert -f docker-compose.yml -o k8s/
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: notificaciones
  name: notificaciones
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: notificaciones
  template:
    metadata:
      annotations:
        kompose.cmd: C:\7MO CICLO\DSW\Club-Nautico\club-nautico-microservicios\kompose.exe convert -f docker-compose.yml -o k8s/
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: notificaciones
    spec:
      containers:
        - env:
            - name: EUREKA_ENABLED
              value: "false"
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8086"
            - name: RABBITMQ_QUEUE
              value: nautica_events
            - name: RABBITMQ_URL
              value: amqp://guest:guest@rabbitmq:5672
            - name: SERVICE_HOST
              value: notificaciones
          image: club-nautico-microservicios-notificaciones:latest
          imagePullPolicy: Never
          name: club-nautico-notificaciones
          ports:
            - containerPort: 8086
              protocol: TCP
      restartPolicy: Always
