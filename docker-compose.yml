  # ═══════════════════════════════════════════════════════════════
  # MS-RESERVAS — Node.js + MongoDB Atlas
  # ═══════════════════════════════════════════════════════════════
  ms-reservas:
    build:
      context: ./ms-reservas
      dockerfile: Dockerfile
    container_name: club-nautico-ms-reservas
    restart: unless-stopped
    ports:
      - "${RESERVAS_PORT:-8085}:8085"
    environment:
      PORT: 8085
      NODE_ENV: production
      MONGO_URI: ${RESERVAS_MONGO_URI}
      CORS_ORIGIN: ${RESERVAS_CORS_ORIGIN:-http://localhost:3000,http://localhost:8080}
    networks:
      - club-nautico-net

  # ═══════════════════════════════════════════════════════════════
  # RABBITMQ — Message Broker (AMQP)
  # Management UI: http://localhost:15672  (guest/guest)
  # ═══════════════════════════════════════════════════════════════
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: club-nautico-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"    # AMQP protocol
      - "15672:15672"  # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 20s
    networks:
      - club-nautico-net

  # ═══════════════════════════════════════════════════════════════
  # MS-NOTIFICACIONES — Consumidor asíncrono de RabbitMQ
  # Health: http://localhost:8086/health
  # ═══════════════════════════════════════════════════════════════
  notificaciones:
    build:
      context: ./notificaciones
      dockerfile: Dockerfile
    container_name: club-nautico-notificaciones
    restart: unless-stopped
    ports:
      - "${NOTIFICACIONES_PORT:-8086}:8086"
    environment:
      PORT: 8086
      NODE_ENV: production
      RABBITMQ_URL:   amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-nautica_events}
      # Eureka (descomentar cuando eureka-server esté activo)
      # EUREKA_HOST:    eureka-server
      # EUREKA_PORT:    8761
      EUREKA_ENABLED: "false"
      SERVICE_HOST:   notificaciones
    depends_on:
      rabbitmq:
        condition: service_healthy
      # eureka-server:   # descomentar cuando esté disponible
      #   condition: service_healthy
    networks:
      - club-nautico-net

volumes:
  postgres_auth_data:
    driver: local
  rabbitmq_data:
    driver: local
  # postgres_socios_data:
  #   driver: local
  # postgres_facturacion_data:
  #   driver: local

networks:
  club-nautico-net:
    driver: bridge