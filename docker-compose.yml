version: "3"

# ═══════════════════════════════════════════════════════════════════
# Club Náutico — Microservicios Stack
# Orquesta los servicios del monorepo (Java/Spring + Node)
# Servicios activos: auth, ms-reservas, rabbitmq, notificaciones
# ═══════════════════════════════════════════════════════════════════

services:

  # ═══════════════════════════════════════════════════════════════
  # AUTH SERVICE
  # ═══════════════════════════════════════════════════════════════
  postgres-auth:
    image: postgres:16-alpine
    container_name: club-nautico-auth-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${AUTH_DB_NAME:-club_nautica_auth_db}
      POSTGRES_USER:     ${AUTH_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-root}
    ports:
      - "5433:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER:-postgres} -d ${AUTH_DB_NAME:-club_nautica_auth_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - club-nautico-net

  auth-service:
    build:
      context: ./ClubNauticoContainer
      dockerfile: auth-service/Dockerfile
    container_name: club-nautico-auth-service
    restart: unless-stopped
    ports:
      - "${AUTH_SERVER_PORT:-8081}:8081"
    environment:
      DB_URL:      jdbc:postgresql://postgres-auth:5432/${AUTH_DB_NAME:-club_nautica_auth_db}
      DB_USERNAME: ${AUTH_DB_USER:-postgres}
      DB_PASSWORD: ${AUTH_DB_PASSWORD:-root}
      JWT_SECRET:                  ${JWT_SECRET:-EstaEsUnaClaveMuySecretaDeAlMenos32Caracteres!!!}
      JWT_ACCESS_EXPIRATION_MS:    ${JWT_ACCESS_EXPIRATION_MS:-3600000}
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS:-7}
      SERVER_PORT: 8081
      JPA_SHOW_SQL: "false"
      # EUREKA_URL: http://eureka-server:8761/eureka/   # descomentar cuando eureka-server esté listo
    depends_on:
      postgres-auth:
        condition: service_healthy
    networks:
      - club-nautico-net

  # ═══════════════════════════════════════════════════════════════
  # EUREKA SERVER —  pendiente
  # ═══════════════════════════════════════════════════════════════
