server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: auth-service
  config:
    import: "optional:configserver:"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/club_nautica_auth_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:false}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: false
    fetch-registry: false

# Configuración JWT — Todos los valores se leen de variables de entorno
# Los valores después de ':' son defaults para desarrollo local
app:
  jwt:
    secret: ${JWT_SECRET:EstaEsUnaClaveMuySecretaDeAlMenos32Caracteres!!!}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:3600000}
    refresh-token-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}