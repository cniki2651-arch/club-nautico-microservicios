# ==============================================================================
#  AUTH-SERVICE — Configuración LOCAL (Bypass del Config Server)
#
#  MODO: Desarrollo standalone. Config Server y Eureka DESACTIVADOS.
#  Para volver a la integración completa: comentar la sección "LOCAL BYPASS"
#  y descomentar la sección "PRODUCCIÓN / CONFIG SERVER".
# ==============================================================================

# ── [LOCAL BYPASS] Desactiva la búsqueda en el Config Server ──────────────────
spring:
  application:
    name: auth-service

  # CLAVE: Esto cancela el intento de conexión a http://localhost:8888
  cloud:
    config:
      enabled: false

  # ── Configuración directa de la base de datos (PostgreSQL) ────────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/club_nautica_auth_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 5

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update        # Crea/actualiza tablas automáticamente
    show-sql: true            # Muestra el SQL generado en la consola (útil en dev)
    properties:
      hibernate:
        format_sql: true

# ── Puerto del servidor ────────────────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8081}

# ── [LOCAL BYPASS] Desactiva el cliente de Eureka ─────────────────────────────
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

# ── Configuración JWT (copiada del config-server para standalone) ──────────────
app:
  jwt:
    secret: ${JWT_SECRET:EstaEsUnaClaveMuySecretaDeAlMenos32Caracteres!!!}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:3600000}
    refresh-token-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}

# ── Logging ────────────────────────────────────────────────────────────────────
logging:
  level:
    club.ms.auth: DEBUG
    org.springframework.security: INFO
    org.springframework.cloud.config: WARN   # Silencia mensajes del config client

