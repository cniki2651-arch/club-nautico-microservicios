version: "3"

# ═══════════════════════════════════════════════════════════════════
# Club Náutico — Auth Service Stack
# Servicios: PostgreSQL + auth-service
# ═══════════════════════════════════════════════════════════════════

services:

  # ─────────────────────────────────────────────────────────────────
  # Base de datos PostgreSQL
  # ─────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: club-nautico-auth-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-club_nautica_auth_db}
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-club_nautica_auth_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─────────────────────────────────────────────────────────────────
  # Microservicio de Autenticación
  # ─────────────────────────────────────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: club-nautico-auth-service
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8081}:8081"
    environment:
      # ── Base de datos ──────────────────────────────────────────────
      DB_URL:      jdbc:postgresql://postgres:5432/${POSTGRES_DB:-club_nautica_auth_db}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-root}

      # ── JWT ────────────────────────────────────────────────────────
      JWT_SECRET:                  ${JWT_SECRET:-EstaEsUnaClaveMuySecretaDeAlMenos32Caracteres!!!}
      JWT_ACCESS_EXPIRATION_MS:    ${JWT_ACCESS_EXPIRATION_MS:-3600000}
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS:-7}

      # ── Servidor ───────────────────────────────────────────────────
      SERVER_PORT: 8081
      JPA_SHOW_SQL: "false"

      # ── Eureka (deshabilitado en modo standalone) ──────────────────
      EUREKA_URL: http://localhost:8761/eureka/
    depends_on:
      postgres:
        condition: service_healthy   # No arranca hasta que postgres esté listo
    networks:
      - club-nautico-net

volumes:
  postgres_data:
    driver: local

networks:
  club-nautico-net:
    driver: bridge
